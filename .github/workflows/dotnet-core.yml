name: MC2IL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Restore dependencies
        run: dotnet restore MC2IL.slnx

      - name: Build solution
        run: dotnet build MC2IL.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test MC2IL.slnx --configuration Release --no-build
